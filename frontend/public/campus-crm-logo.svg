<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 120" width="100%" height="100%">
  <defs>
    <!-- Outer Metallic Ring -->
    <linearGradient id="crmOuterRing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f1f5f9" />
      <stop offset="35%" stop-color="#94a3b8" />
      <stop offset="70%" stop-color="#475569" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>

    <!-- Dark Circular Background -->
    <radialGradient id="crmDarkBg" cx="35%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#27272a" />
      <stop offset="60%" stop-color="#18181b" />
      <stop offset="100%" stop-color="#09090b" />
    </radialGradient>

    <!-- Inner Metallic Accent Ring -->
    <linearGradient id="crmInnerRing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#52525b" stop-opacity="0.3" />
    </linearGradient>

    <!-- Fold Overlay Gradient -->
    <linearGradient id="crmFoldShadow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e4e4e7" />
      <stop offset="100%" stop-color="#a1a1aa" />
    </linearGradient>
  </defs>

  <!-- Dark Background Banner for standalone SVG preview -->
  <rect width="500" height="120" rx="16" fill="#09090b" />

  <!-- Logo Badge Group -->
  <g transform="translate(15, 10)">
    <!-- Outer Silver Ring -->
    <circle cx="50" cy="50" r="48" fill="url(#crmOuterRing)" />

    <!-- Main Dark Circle -->
    <circle cx="50" cy="50" r="43.5" fill="url(#crmDarkBg)" />

    <!-- Inner Subtle Chrome Border -->
    <circle cx="50" cy="50" r="39.5" stroke="url(#crmInnerRing)" stroke-width="1.2" fill="none" />

    <!-- Main White 'C' Shape -->
    <path d="M 68 32 A 24 24 0 1 0 68 68 L 58.5 58.5 A 11.5 11.5 0 1 1 58.5 41.5 Z" fill="#FFFFFF" />

    <!-- Stylized Diagonal Fold Cut Accent -->
    <path d="M 32.5 32.5 L 43.5 43.5 L 30.5 51.5 Z" fill="url(#crmFoldShadow)" />
  </g>

  <!-- Text Group -->
  <!-- "Campus" in White -->
  <text x="135" y="62" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="44" fill="#FFFFFF" letter-spacing="-1">Campus</text>
  
  <!-- "CRM" in Light Silver -->
  <text x="305" y="62" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="44" fill="#94A3B8" letter-spacing="-1">CRM</text>

  <!-- Tagline: — CONNECT. MANAGE. GROW. — -->
  <line x1="135" y1="86" x2="165" y2="86" stroke="#64748B" stroke-width="1.5" />
  <text x="175" y="90" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="11" fill="#94A3B8" letter-spacing="2.5">CONNECT. MANAGE. GROW.</text>
  <line x1="435" y1="86" x2="465" y2="86" stroke="#64748B" stroke-width="1.5" />
</svg>
